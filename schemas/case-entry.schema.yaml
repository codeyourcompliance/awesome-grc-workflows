$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/codeyourcompliance/awesome-grc-workflows/schemas/case-entry.schema.yaml"
title: Awesome GRC Workflows Public Case Metadata
type: object
additionalProperties: false
required:
  - id
  - title
  - status
  - version
  - last_reviewed
  - domains
  - bounded_action
  - decision_target
  - difficulty
  - estimated_time_minutes
  - required_tools
  - deliverables
  - authority_boundaries
  - synthetic_data
  - private_dependency
  - maintainer_service_required
  - public_resources
  - pilot_completions
properties:
  id:
    type: string
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    not:
      pattern: '^(?:wfa|src|emp|cg|mir|aprprep)-'
  title:
    type: string
    minLength: 5
  status:
    type: string
    enum:
      - proposed
      - design-ready
      - case-ready
      - pilot-tested
      - validated-case
  version:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  last_reviewed:
    type: string
    format: date
  domains:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum:
        - access-governance
        - ai-governance
        - cloud-assurance
        - compliance
        - continuous-control-monitoring
        - evidence-engineering
        - incident-review
        - it-audit
        - operational-resilience
        - privacy
        - remediation-validation
        - technology-risk
        - third-party-risk
  bounded_action:
    type: string
    minLength: 15
  decision_target:
    type: string
    minLength: 10
  difficulty:
    type: string
    enum:
      - foundational
      - intermediate
      - advanced
  estimated_time_minutes:
    type: integer
    minimum: 15
    maximum: 480
  required_tools:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 2
  deliverables:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 3
  role_families:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 3
  authority_boundaries:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 10
  synthetic_data:
    const: true
  private_dependency:
    const: false
  maintainer_service_required:
    const: false
  public_resources:
    type: array
    uniqueItems: true
    items:
      type: string
      format: uri
  pilot_completions:
    type: integer
    minimum: 0
allOf:
  - if:
      properties:
        status:
          enum:
            - case-ready
            - pilot-tested
            - validated-case
      required:
        - status
    then:
      properties:
        public_resources:
          minItems: 1
  - if:
      properties:
        status:
          const: pilot-tested
      required:
        - status
    then:
      properties:
        pilot_completions:
          minimum: 1
  - if:
      properties:
        status:
          const: validated-case
      required:
        - status
    then:
      properties:
        pilot_completions:
          minimum: 2
