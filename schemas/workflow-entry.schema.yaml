$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/codeyourcompliance/awesome-grc-workflows/schemas/workflow-entry.schema.yaml"
title: Awesome GRC Workflow Entry

type: object
additionalProperties: false
required:
  - id
  - title
  - domains
  - status
  - first_observed
  - last_reviewed
  - independent_employers
  - challenge_status
properties:
  id:
    type: string
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  title:
    type: string
    minLength: 5
  domains:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum:
        - access-governance
        - ai-governance
        - cloud-assurance
        - compliance
        - continuous-control-monitoring
        - evidence-engineering
        - incident-review
        - it-audit
        - operational-resilience
        - remediation-validation
        - technology-risk
        - third-party-risk
  status:
    type: string
    enum:
      - observed
      - repeated
      - candidate
      - challenge-ready
      - pilot-tested
      - validated-pattern
  first_observed:
    type: string
    format: date
  last_reviewed:
    type: string
    format: date
  independent_employers:
    type: integer
    minimum: 0
  challenge_status:
    type: string
    enum:
      - none
      - proposed
      - challenge-ready
      - pilot-tested
      - published
